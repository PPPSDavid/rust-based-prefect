# Optional basic-auth overlay for deploy/docker/compose.yml (Tier C + B5).
#
#   docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.auth.yml up --build

services:
  server:
    environment:
      FLOWOXIDE_SERVER_API_AUTH_STRING: ${FLOWOXIDE_SERVER_API_AUTH_STRING:-admin:pass}

  worker:
    environment:
      FLOWOXIDE_API_AUTH_STRING: ${FLOWOXIDE_API_AUTH_STRING:-admin:pass}
