site_name: FlowOxide
site_description: >-
  FlowOxide is a Rust-based, Prefect-style orchestration engine:
  write @flow / @task in Python (prefect_compat); the control plane runs in Rust.
site_url: https://pppsdavid.github.io/rust-based-prefect/
repo_url: https://github.com/PPPSDavid/rust-based-prefect
edit_uri: edit/main/docs/

# Published site = end-user docs only. Maintainer/roadmap/CI notes stay in-repo for GitHub browsing.
exclude_docs: |
  plans/**
  agent/**
  MEMORY_BANK.md
  DISTRIBUTION.md
  benchmark_baseline.md
  perf_baseline_pre_next_step.md
  perf_candidate*.md
  perf_compare*.md
  perf_design_note.md
  perf_matrix_summary.md
  perf_methodology.md
  compatibility_review_workflow.md
  ui_phase1_api_contract.md
  gen_llms.py

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

nav:
  - Home: index.md
  - Get started:
      - "Installation (PyPI · pip / uv)": INSTALL.md
      - "Quick start: PyPI (no clone)": QUICKSTART_PYPI.md
      - "Quick start (demo flow)": QUICKSTART_DEMO.md
      - "Quickstart: first deployment": quickstart-first-deployment.md
      - "Self-hosted server": SELF_HOSTED_SERVER.md
      - "Optional: verify the web UI": ui_e2e_visual_check.md
  - Concepts:
      - "Concepts overview": concepts/index.md
      - Flows: concepts/flows.md
      - Tasks: concepts/tasks.md
      - Runners: concepts/runners.md
      - "DAG and forecast": concepts/dag-and-forecast.md
      - "States and transitions": concepts/states-and-transitions.md
      - "Prefect → FlowOxide": PREFECT_FLOWOXIDE_MAPPING.md
      - Architecture: architecture.md
  - "How-to guides":
      - Overview: how-to/index.md
      - "How to set up FlowOxide": how-to/setup.md
      - "How to run the server and UI": how-to/server-and-ui.md
      - "How to run the server in Docker": how-to/docker-quickstart.md
      - "How to run FlowOxide with Docker Compose": how-to/docker-compose.md
      - "How to run background services": how-to/run-background-services.md
      - "How to use Postgres for the control plane": how-to/database-postgres.md
      - "How to run workers in HTTP mode": how-to/worker-http-mode.md
      - "How to secure a self-hosted server": how-to/secure-self-hosted.md
      - "How to deploy with the CLI and flowoxide.yaml": how-to/deploy-with-cli.md
      - "How to create and update deployments": how-to/deployments.md
      - "How to compose flows with subflows": how-to/subflows.md
      - "How to choose a task runner": how-to/choose-task-runners.md
      - "How to use concurrency limits": how-to/concurrency-limits.md
      - "How to port a flow from Prefect": how-to/port-from-prefect.md
  - Reference:
      - "Compatibility matrix": compatibility.md
      - "Environment variables": reference/env-vars.md
      - "REST API overview": reference/api.md
      - "Troubleshooting and FAQ": reference/troubleshooting.md
      - "Performance (vs Prefect)": PERFORMANCE_OVERVIEW.md

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_llms.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PPPSDavid/rust-based-prefect
      name: FlowOxide on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/flowoxide-prefect-compat/
      name: flowoxide-prefect-compat on PyPI

strict: true
