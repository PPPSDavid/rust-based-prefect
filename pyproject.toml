[project]
name = "ironflow"
version = "0.0.0"
description = "IronFlow monorepo workspace root (not published to PyPI). Holds shared tooling and dependency groups."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "networkx>=3,<4",
  "pyyaml>=6,<7",
  "rich>=13,<14",
  "ruff>=0.8,<1",
  "ty>=0.0.1,<1",
  "psycopg[binary]>=3.1,<4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python-shim", "static-planner"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "frontend",
    "rust-engine",
    "data",
    "node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "I", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# Setuptools path bootstrap before local imports.
"python-shim/setup.py" = ["E402"]
# Intentional sys.path bootstrap before prefect_compat import.
"benchmarks/perf_matrix.py" = ["E402"]
# McCabe backlog (god files / parked harness). Shrink this list as modules split.
"benchmarks/subflow_perf.py" = ["C901"]
"python-shim/src/prefect_compat/concurrency_store.py" = ["C901"]
"python-shim/src/prefect_compat/decorators.py" = ["C901"]
"python-shim/src/prefect_compat/persistence/store_sqlite.py" = ["C901"]
"static-planner/src/static_planner/planner.py" = ["C901"]

[tool.ty.environment]
extra-paths = ["python-shim/src", "static-planner/src"]
python-version = "3.11"

[tool.ty.rules]
deprecated = "ignore"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ty.analysis]
# Optional deps not installed in the default CI Python environment.
allowed-unresolved-imports = [
    "code_review_graph.**",
    "crg_st_model_cache",
    "mcp.**",
    "mkdocs_gen_files",
    "prefect",
    "sentence_transformers.**",
    "torch",
]

[tool.ty.src]
include = [
    "benchmarks",
    "docs/gen_llms.py",
    "python-shim",
    "scripts",
    "static-planner",
    "tools",
]
exclude = [
    "python-shim/setup.py",
    "python-shim/build_native.py",
    # Mixins share `self` across classes; attribute types live on InMemoryControlPlane.
    "python-shim/src/prefect_compat/control_plane/dag.py",
    "python-shim/src/prefect_compat/control_plane/deployment_runs.py",
    "python-shim/src/prefect_compat/control_plane/deployments.py",
    "python-shim/src/prefect_compat/control_plane/gates.py",
    "python-shim/src/prefect_compat/control_plane/gcl.py",
    "python-shim/src/prefect_compat/control_plane/lifecycle.py",
    "python-shim/src/prefect_compat/control_plane/queries.py",
    "python-shim/src/prefect_compat/control_plane/resume.py",
    "python-shim/src/prefect_compat/control_plane/run_events.py",
    "python-shim/src/prefect_compat/control_plane/runs.py",
    "python-shim/src/prefect_compat/control_plane/rust_dispatch.py",
    "python-shim/src/prefect_compat/control_plane/store.py",
    "python-shim/src/prefect_compat/control_plane/flow_catalog.py",
]
