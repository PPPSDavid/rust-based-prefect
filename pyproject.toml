[project]
name = "ironflow"
version = "0.0.0"
description = "IronFlow monorepo workspace root (not published to PyPI). Holds shared tooling and dependency groups."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pydantic>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "networkx>=3,<4",
  "pyyaml>=6,<7",
  "rich>=13,<14",
  "ruff>=0.8,<1",
  "ty>=0.0.1,<1",
  "psycopg[binary]>=3.1,<4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python-shim", "static-planner"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "frontend",
    "rust-engine",
    "data",
    "node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Setuptools path bootstrap before local imports.
"python-shim/setup.py" = ["E402"]
# Intentional sys.path bootstrap before prefect_compat import.
"benchmarks/perf_matrix.py" = ["E402"]

[tool.ty.environment]
extra-paths = ["python-shim/src", "static-planner/src"]
python-version = "3.11"

[tool.ty.rules]
deprecated = "ignore"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ty.analysis]
# Optional deps not installed in the default CI Python environment.
allowed-unresolved-imports = [
    "code_review_graph.**",
    "crg_st_model_cache",
    "mcp.**",
    "mkdocs_gen_files",
    "prefect",
    "sentence_transformers.**",
    "torch",
]

[tool.ty.src]
include = [
    "benchmarks",
    "docs/gen_llms.py",
    "python-shim",
    "scripts",
    "static-planner",
    "tools",
]
exclude = [
    "python-shim/setup.py",
    "python-shim/build_native.py",
]
