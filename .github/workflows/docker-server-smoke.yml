name: Docker server smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/docker/**"
      - "python-shim/src/prefect_compat/auth.py"
      - "python-shim/src/prefect_compat/auth_middleware.py"
      - "python-shim/src/prefect_compat/server.py"
      - "python-shim/src/prefect_compat/deploy/client.py"
      - "scripts/docker_server_smoke.sh"
      - ".github/workflows/docker-server-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Docker server smoke
        run: bash scripts/docker_server_smoke.sh
