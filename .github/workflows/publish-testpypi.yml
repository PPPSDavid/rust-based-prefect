# Manual publish of ironflow-prefect-compat wheels to TestPyPI.
#
# One-time maintainer setup:
# 1. Create https://test.pypi.org/account/register/ and a project (or let first upload create it).
# 2. Prefer OIDC: Project Settings → Manage → Publishing → add a "trusted publisher"
#    for this repo + workflow file + environment (if used).
# 3. Or create an API token on TestPyPI and store it as repo secret TEST_PYPI_API_TOKEN,
#    then add a password step (see pypa/gh-action-pypi-publish docs).
#
# Run: Actions → "Publish to TestPyPI" → Run workflow (optional: dry-run = build only).

name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheels only (skip upload)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux
            runner: ubuntu-latest
            python-version: "3.11"
            artifact-name: wheel-linux-py311
          - slug: linux
            runner: ubuntu-latest
            python-version: "3.12"
            artifact-name: wheel-linux-py312
          - slug: linux-aarch64
            runner:
              - self-hosted
              - linux
              - ARM64
            artifact-name: wheel-linux-aarch64
          - slug: windows
            runner: windows-latest
            python-version: "3.11"
            artifact-name: wheel-windows-py311
          - slug: windows
            runner: windows-latest
            python-version: "3.12"
            artifact-name: wheel-windows-py312
          - slug: macos
            runner: macos-latest
            python-version: "3.11"
            artifact-name: wheel-macos-py311
          - slug: macos
            runner: macos-latest
            python-version: "3.12"
            artifact-name: wheel-macos-py312
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.slug != 'linux-aarch64'
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify system Python 3.11 (self-hosted aarch64)
        if: matrix.slug == 'linux-aarch64'
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux' && matrix.slug != 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          python -m pip install build auditwheel

      - name: Install packaging tools (Linux aarch64)
        if: matrix.slug == 'linux-aarch64'
        run: |
          python3 -m venv "${RUNNER_TEMP}/if-aarch64-venv"
          echo "${RUNNER_TEMP}/if-aarch64-venv/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/if-aarch64-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/if-aarch64-venv/bin/pip" install cibuildwheel

      - name: Install packaging tools (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel (python-shim)
        if: matrix.slug != 'linux-aarch64'
        working-directory: python-shim
        run: python -m build --wheel

      - name: Build wheel (python-shim, Linux aarch64 via cibuildwheel)
        if: matrix.slug == 'linux-aarch64'
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_SKIP: "*musllinux*"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && ln -sf /root/.cargo/bin/cargo /usr/local/bin/cargo && ln -sf /root/.cargo/bin/rustc /usr/local/bin/rustc"
          CIBW_ENVIRONMENT: "IRONFLOW_FORCE_PLATFORM_WHEEL=1 PATH=/root/.cargo/bin:$PATH"
        run: cibuildwheel --platform linux --output-dir python-shim/wheelhouse python-shim

      - name: Auditwheel repair (Linux)
        if: runner.os == 'Linux' && matrix.slug != 'linux-aarch64'
        working-directory: python-shim
        shell: bash
        run: |
          mkdir -p wheelhouse
          shopt -s nullglob
          for f in dist/*.whl; do
            auditwheel repair "$f" -w wheelhouse || cp "$f" wheelhouse/
          done

      - name: Stage wheel (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        working-directory: python-shim
        run: |
          mkdir -p wheelhouse
          cp dist/*.whl wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: python-shim/wheelhouse/*.whl

  publish:
    needs: build
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Collect wheels for upload
        run: |
          mkdir -p dist
          find wheels -name '*.whl' -exec cp -t dist {} +
          ls -la dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
