name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check VERSION matches artifacts
        run: python scripts/check_version_sync.py

  python-rust:
    name: Python + Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Python tests
        run: python -m pytest python-shim/tests static-planner/tests benchmarks/tests
      - name: Rust tests
        run: cargo test --manifest-path rust-engine/Cargo.toml

  wheel-linux:
    name: Linux wheel (bundled ironflow_engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          python -m pip install build auditwheel
      - name: Build wheel (python-shim)
        working-directory: python-shim
        run: python -m build --wheel
      - name: Auditwheel repair (manylinux tag)
        working-directory: python-shim
        shell: bash
        run: |
          mkdir -p wheelhouse
          shopt -s nullglob
          for f in dist/*.whl; do
            auditwheel repair "$f" -w wheelhouse || cp "$f" wheelhouse/
          done
      - name: Smoke install wheel
        shell: bash
        run: |
          python -m venv /tmp/ifwh
          . /tmp/ifwh/bin/activate
          pip install python-shim/wheelhouse/*.whl
          python -c "from prefect_compat.rust_bridge import native_library_available as n; assert n(); print('native ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-linux
          path: python-shim/wheelhouse/*.whl

  wheel-linux-aarch64:
    name: Linux aarch64 wheel (bundled ironflow_engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up QEMU for aarch64 wheel builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel
      - name: Build aarch64 wheel (python-shim via cibuildwheel)
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_SKIP: "*musllinux*"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && ln -sf /root/.cargo/bin/cargo /usr/local/bin/cargo && ln -sf /root/.cargo/bin/rustc /usr/local/bin/rustc"
          CIBW_ENVIRONMENT: "IRONFLOW_FORCE_PLATFORM_WHEEL=1 PATH=/root/.cargo/bin:$PATH"
        run: cibuildwheel --platform linux --output-dir python-shim/wheelhouse python-shim
      - name: Verify aarch64 wheel artifact exists
        shell: bash
        run: |
          ls -la python-shim/wheelhouse/
          ls python-shim/wheelhouse/*aarch64*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-linux-aarch64
          path: python-shim/wheelhouse/*.whl

  wheel-windows:
    name: Windows wheel (bundled ironflow_engine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel (python-shim)
        working-directory: python-shim
        run: python -m build --wheel
      - name: Stage wheel for artifact
        shell: bash
        working-directory: python-shim
        run: |
          mkdir -p wheelhouse
          cp dist/*.whl wheelhouse/
      - name: Smoke install wheel
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "ifwh-win"
          python -m venv $venv
          $pip = Join-Path $venv "Scripts\pip.exe"
          $py = Join-Path $venv "Scripts\python.exe"
          $whl = (Get-Item "python-shim\wheelhouse\*.whl" | Select-Object -First 1).FullName
          & $pip install $whl
          & $py -c "from prefect_compat.rust_bridge import native_library_available as n; assert n(); print('native ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-windows
          path: python-shim/wheelhouse/*.whl

  wheel-macos:
    name: macOS wheel (bundled ironflow_engine)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel (python-shim)
        working-directory: python-shim
        run: python -m build --wheel
      - name: Stage wheel for artifact
        shell: bash
        working-directory: python-shim
        run: |
          mkdir -p wheelhouse
          cp dist/*.whl wheelhouse/
      - name: Smoke install wheel
        shell: bash
        run: |
          python -m venv /tmp/ifwh-macos
          . /tmp/ifwh-macos/bin/activate
          pip install python-shim/wheelhouse/*.whl
          python -c "from prefect_compat.rust_bridge import native_library_available as n; assert n(); print('native ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-macos
          path: python-shim/wheelhouse/*.whl

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm test
