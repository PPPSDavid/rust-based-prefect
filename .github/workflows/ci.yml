name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint (ruff + ty + metrics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --frozen --group dev --python 3.11
      - name: Ruff check
        run: uv run --python 3.11 ruff check .
      - name: Ruff format
        run: uv run --python 3.11 ruff format --check .
      - name: ty check
        run: uv run --python 3.11 ty check
      - name: File LOC ratchet
        run: uv run --python 3.11 python scripts/code_metrics.py

  rust-lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: cargo fmt
        run: cargo fmt --manifest-path rust-engine/Cargo.toml -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path rust-engine/Cargo.toml --all-targets -- -D warnings

  version:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check VERSION matches artifacts
        run: python scripts/check_version_sync.py
      - name: Check CPython support matrix
        run: python scripts/check_python_support_matrix.py --require-freethreaded 3.14

  python-rust:
    name: Python + Rust tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --frozen --group dev --python ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Python tests
        # Pin interpreter explicitly: `uv run` otherwise re-creates .venv from
        # committed `.python-version` (3.12) and ignores the matrix sync.
        run: uv run --python ${{ matrix.python-version }} pytest python-shim/tests static-planner/tests benchmarks/tests
      - name: Airtight concurrency invariants
        run: uv run --python ${{ matrix.python-version }} pytest -m airtight
      - name: Rust tests
        run: cargo test --manifest-path rust-engine/Cargo.toml

  python-rust-freethread:
    name: Python 3.14t experimental (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --frozen --group dev --python 3.14t
      - uses: dtolnay/rust-toolchain@stable
      - name: Python tests
        run: uv run --python 3.14t pytest python-shim/tests static-planner/tests benchmarks/tests
      - name: Airtight concurrency invariants
        run: uv run --python 3.14t pytest -m airtight
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          python -m pip install build auditwheel
      - name: Build Linux cp314t wheel
        working-directory: python-shim
        run: python -m build --wheel
      - name: Auditwheel repair
        working-directory: python-shim
        shell: bash
        run: |
          mkdir -p wheelhouse
          shopt -s nullglob
          for f in dist/*.whl; do
            auditwheel repair "$f" -w wheelhouse || cp "$f" wheelhouse/
          done
      - name: Smoke install wheel on 3.14t
        shell: bash
        run: |
          python -m venv /tmp/ifwh-ft
          . /tmp/ifwh-ft/bin/activate
          pip install python-shim/wheelhouse/*.whl
          python -c "from prefect_compat.rust_bridge import native_library_available as n; assert n(); print('native ok', __import__('sys').abiflags)"
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-linux-3.14t
          path: python-shim/wheelhouse/*.whl

  python-rust-postgres:
    name: Python + Postgres (B1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ironflow
          POSTGRES_PASSWORD: ironflow
          POSTGRES_DB: ironflow_b1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironflow -d ironflow_b1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRONFLOW_DATABASE_URL: postgresql://ironflow:ironflow@127.0.0.1:5432/ironflow_b1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --frozen --group dev --python 3.12
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Build rust-engine
        run: cargo build --manifest-path rust-engine/Cargo.toml
      - name: Postgres store + claim tests
        run: >
          uv run --python 3.12 pytest
          python-shim/tests/test_postgres_store.py
          python-shim/tests/test_persistence_store.py
          -q

  wheel-linux:
    name: Linux x86_64 wheel (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          python -m pip install build auditwheel
      - name: Build wheel (python-shim)
        working-directory: python-shim
        run: python -m build --wheel
      - name: Auditwheel repair (manylinux tag)
        working-directory: python-shim
        shell: bash
        run: |
          mkdir -p wheelhouse
          shopt -s nullglob
          for f in dist/*.whl; do
            auditwheel repair "$f" -w wheelhouse || cp "$f" wheelhouse/
          done
      - name: Smoke install wheel
        shell: bash
        run: |
          python -m venv /tmp/ifwh
          . /tmp/ifwh/bin/activate
          pip install python-shim/wheelhouse/*.whl
          python -c "from prefect_compat.rust_bridge import native_library_available as n; assert n(); print('native ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-linux-${{ matrix.python-version }}
          path: python-shim/wheelhouse/*.whl

  wheel-linux-aarch64:
    name: Linux aarch64 wheel (bundled ironflow_engine)
    # Native ARM64 (e.g. Raspberry Pi self-hosted runner). See .github/SELF_HOSTED_CI_RUNNER.md
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      # setup-python does not ship arm64+Debian12 in the versions manifest; use system Python 3.11.
      - name: Verify system Python 3.11
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
      - uses: dtolnay/rust-toolchain@stable
      # Debian/Raspberry Pi OS uses PEP 668 (no pip install onto system python).
      - name: Install packaging tools (venv)
        run: |
          python3 -m venv "${RUNNER_TEMP}/if-aarch64-venv"
          echo "${RUNNER_TEMP}/if-aarch64-venv/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/if-aarch64-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP}/if-aarch64-venv/bin/pip" install cibuildwheel
      - name: Build aarch64 wheel (python-shim via cibuildwheel)
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_SKIP: "*musllinux*"
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && ln -sf /root/.cargo/bin/cargo /usr/local/bin/cargo && ln -sf /root/.cargo/bin/rustc /usr/local/bin/rustc"
          CIBW_ENVIRONMENT: "IRONFLOW_FORCE_PLATFORM_WHEEL=1 PATH=/root/.cargo/bin:$PATH"
        run: cibuildwheel --platform linux --output-dir python-shim/wheelhouse python-shim
      - name: Verify aarch64 wheel artifacts exist
        shell: bash
        run: |
          ls -la python-shim/wheelhouse/
          ls python-shim/wheelhouse/*cp311*aarch64*.whl
          ls python-shim/wheelhouse/*cp312*aarch64*.whl
          ls python-shim/wheelhouse/*cp313*aarch64*.whl
          ls python-shim/wheelhouse/*cp314*aarch64*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-linux-aarch64
          path: python-shim/wheelhouse/*.whl

  wheel-windows:
    name: Windows wheel (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel (python-shim)
        working-directory: python-shim
        run: python -m build --wheel
      - name: Stage wheel for artifact
        shell: bash
        working-directory: python-shim
        run: |
          mkdir -p wheelhouse
          cp dist/*.whl wheelhouse/
      - name: Smoke install wheel
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "ifwh-win"
          python -m venv $venv
          $pip = Join-Path $venv "Scripts\pip.exe"
          $py = Join-Path $venv "Scripts\python.exe"
          $whl = (Get-Item "python-shim\wheelhouse\*.whl" | Select-Object -First 1).FullName
          & $pip install $whl
          & $py -c "from prefect_compat.rust_bridge import native_library_available as n; assert n(); print('native ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-windows-${{ matrix.python-version }}
          path: python-shim/wheelhouse/*.whl

  wheel-macos:
    name: macOS wheel (py${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel (python-shim)
        working-directory: python-shim
        run: python -m build --wheel
      - name: Stage wheel for artifact
        shell: bash
        working-directory: python-shim
        run: |
          mkdir -p wheelhouse
          cp dist/*.whl wheelhouse/
      - name: Smoke install wheel
        shell: bash
        run: |
          python -m venv /tmp/ifwh-macos
          . /tmp/ifwh-macos/bin/activate
          pip install python-shim/wheelhouse/*.whl
          python -c "from prefect_compat.rust_bridge import native_library_available as n; assert n(); print('native ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ironflow-prefect-compat-wheel-macos-${{ matrix.python-version }}
          path: python-shim/wheelhouse/*.whl

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test, and typecheck
        run: |
          npm ci
          npm test
          npm run build

  frontend-e2e:
    name: Frontend Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --frozen --group dev --python 3.11
      - name: Expose uv venv on PATH
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
